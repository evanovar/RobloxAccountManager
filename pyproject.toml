[project]
name = "evanovar-ram"
dynamic = ["version"]
description = "A Windows desktop application for managing multiple Roblox accounts."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pycryptodome>=3.15.0",
    "psutil>=5.9.0",
    "pyside6>=6.12.0",
    "pywin32>=305",
    "requests>=2.28.0",
    "selenium>=4.6.0",
    "websockets>=12.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "utils.version.APP_VERSION" }

[tool.ruff.lint]
select = ["E9", "F", "E722"]
