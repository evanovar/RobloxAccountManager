name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uvx ruff@0.16.10 check src tests scripts

      - name: Prepare signed non-Microsoft test fixture
        shell: pwsh
        run: |
          $fixtureArchive = Join-Path $env:RUNNER_TEMP "python-signed-fixture.zip"
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "python-signed-fixture"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.0/python-3.14.0-embed-amd64.zip" -OutFile $fixtureArchive -TimeoutSec 60
          Expand-Archive -LiteralPath $fixtureArchive -DestinationPath $fixtureDirectory
          "RAM_TEST_SIGNED_PYTHON=$(Join-Path $fixtureDirectory 'python.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        run: uv run --no-sync python scripts/run_tests.py --all -v
