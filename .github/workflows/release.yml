name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in vX.Y.Z format"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build with PyInstaller
        run: .\scripts\build.cmd
        env:
          RAM_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Verify build output
        run: |
          if not exist "dist\EvanovarRAM.exe" (
            echo Build output missing.
            exit /b 1
          )
          dir /b "dist\EvanovarRAM-v*.exe" >nul 2>&1
          if errorlevel 1 (
            echo Versioned release asset missing.
            exit /b 1
          )
        shell: cmd

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Evanovar RAM ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/EvanovarRAM-v*.exe
